name: Test Project
on: push
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "02"
    steps:
      - name: Get Code From Repo
        uses: actions/checkout@v3
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install Dependencies
        run: npm ci
      - name: Run tests
        run: npm test
  deployment:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "02"
    steps:
      - name: Get Code From Repo
        uses: actions/checkout@v3
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install Dependencies
        run: npm ci
      - name: Build Project
        run: npm run build  
      - name: Deploy
        run: echo "Deploying ..."
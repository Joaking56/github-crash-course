name: 03 - Test, Lint And Deploy
on: workflow_dispatch
jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "03"
    steps:
      - name: Get Code From Repo
        uses: actions/checkout@v3
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install Dependencies
        run: npm ci
      - name: Run tests
        run: npm run lint
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "03"
    steps:
      - name: Get Code From Repo
        uses: actions/checkout@v3
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install Dependencies
        run: npm ci
      - name: Run tests
        run: npm test
  deployment:
    needs: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "03"
    steps:
      - name: Get Code From Repo
        uses: actions/checkout@v3
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install Dependencies
        run: npm ci
      - name: Build Project
        run: npm run build  
      - name: Deploy
        run: echo "Deploying ..."